services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: inventrix
      POSTGRES_PASSWORD: inventrix
      POSTGRES_DB: inventrix
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inventrix"]
      interval: 2s
      retries: 15

  api:
    build:
      context: .
      dockerfile: packages/api/Dockerfile
    environment:
      DATABASE_URL: postgres://inventrix:inventrix@db:5432/inventrix
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in the shell or .env}
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: packages/frontend/Dockerfile
    environment:
      API_HOST: api
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  db-data:
